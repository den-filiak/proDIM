const project = new URLSearchParams(location.search).get('project') || 'house61';
const d = DATA[project] || DATA.house61;

function formatPriceEn(uaPrice){
  const clean = String(uaPrice).trim();
  const parts = clean.split(',');
  const intPart = parts[0].trim().replace(/\s+/g, ',');
  const decPart = parts[1] || '00';
  return `${intPart}.${decPart}`;
}

// TABLE — приймає одну з двох спільних таблиць, рендерить з заголовком-секцією
function buildTable(table, lang){
  const wrap=document.createElement('div'); wrap.className='table-block';
  const h3=document.createElement('h3'); h3.className='table-title';
  h3.textContent = lang==='en' ? table.titleEn : table.title;
  wrap.appendChild(h3);

  const scroll=document.createElement('div'); scroll.style.overflowX='auto';
  const t=document.createElement('table'); t.className='spec-table';
  const thead=document.createElement('thead');
  const hr=document.createElement('tr');
  const headers = lang==='en' ? table.headersEn : table.headers;
  headers.forEach(h=>{ const th=document.createElement('th'); th.textContent=h; hr.appendChild(th); });
  thead.appendChild(hr); t.appendChild(thead);
  const tbody=document.createElement('tbody');

  table.rows.forEach(row=>{
    const tr=document.createElement('tr');
    const td0=document.createElement('td');
    const name = lang==='en' ? row.nameEn : row.name;
    const desc = lang==='en' ? row.descEn : row.desc;
    td0.innerHTML=`<strong>${name}</strong>${desc?'<br><span class="note">'+desc+'</span>':''}`;
    tr.appendChild(td0);
    row.vals.forEach(v=>{
      const td=document.createElement('td');
      td.innerHTML = v==='+' ? '<span class="plus">+</span>' : v==='−' ? '<span class="minus">−</span>' : v;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  t.appendChild(tbody); scroll.appendChild(t); wrap.appendChild(scroll); return wrap;
}

// ЦІНА — три картки, як в оригінальному каталозі (а не рядок таблиці)
function buildPriceBoxes(lang){
  const wrap=document.createElement('div'); wrap.className='price-boxes';
  const labels = lang==='en'
    ? ['Ready for finishing','Finished','Turnkey']
    : ['Під оздоблення','З оздобленням','Під ключ'];
  d.price.forEach((v,i)=>{
    const box=document.createElement('div'); box.className='price-box'+(i===2?' price-box-main':'');
    const lbl=document.createElement('span'); lbl.textContent=labels[i];
    const val=document.createElement('strong'); val.textContent=(lang==='en'?formatPriceEn(v):v)+(lang==='en'?' UAH':' грн');
    box.appendChild(lbl); box.appendChild(val);
    wrap.appendChild(box);
  });
  return wrap;
}

// СТОРІНКА 32: додаткові опції / не входить / зверніть увагу — спільне для всіх моделей
function buildChangeInfo(lang){
  const wrap=document.createElement('div'); wrap.className='change-info';

  const col1=document.createElement('div'); col1.className='change-col';
  const h1_=document.createElement('h4'); h1_.textContent = lang==='en'?CHANGE_INFO.optionsTitleEn:CHANGE_INFO.optionsTitle;
  const ul1=document.createElement('ul');
  (lang==='en'?CHANGE_INFO.optionsEn:CHANGE_INFO.options).forEach(t=>{const li=document.createElement('li');li.textContent=t;ul1.appendChild(li);});
  col1.appendChild(h1_); col1.appendChild(ul1);

  const col2=document.createElement('div'); col2.className='change-col';
  const h2_=document.createElement('h4'); h2_.textContent = lang==='en'?CHANGE_INFO.notIncludedTitleEn:CHANGE_INFO.notIncludedTitle;
  const ul2=document.createElement('ul');
  (lang==='en'?CHANGE_INFO.notIncludedEn:CHANGE_INFO.notIncluded).forEach(t=>{const li=document.createElement('li');li.textContent=t;ul2.appendChild(li);});
  col2.appendChild(h2_); col2.appendChild(ul2);

  const col3=document.createElement('div'); col3.className='change-col change-attention';
  const h3_=document.createElement('h4'); h3_.textContent = lang==='en'?CHANGE_INFO.attentionTitleEn:CHANGE_INFO.attentionTitle;
  const p3=document.createElement('p'); p3.textContent = lang==='en'?CHANGE_INFO.attentionTextEn:CHANGE_INFO.attentionText;
  col3.appendChild(h3_); col3.appendChild(p3);

  wrap.appendChild(col1); wrap.appendChild(col2); wrap.appendChild(col3);

  const turnkey=document.createElement('div'); turnkey.className='change-turnkey';
  turnkey.innerHTML = `<strong>${lang==='en'?CHANGE_INFO.turnkeyTitleEn:CHANGE_INFO.turnkeyTitle}</strong><span>${lang==='en'?CHANGE_INFO.turnkeyTextEn:CHANGE_INFO.turnkeyText}</span>`;

  const outer=document.createElement('div');
  outer.appendChild(wrap);
  outer.appendChild(turnkey);
  return outer;
}

function buildExtra(lang){

  d.extraText.forEach(item=>{
    if(item.type==='h3'){
      const h=document.createElement('h3');
      h.textContent = lang==='en' ? item.textEn : item.text;
      div.appendChild(h);
    } else if(item.type==='ul'){
      const ul=document.createElement('ul');
      const items = lang==='en' ? item.itemsEn : item.items;
      items.forEach(li=>{
        const l=document.createElement('li');
        l.textContent = li;
        ul.appendChild(l);
      });
      div.appendChild(ul);
    }
  });
  return div;
}

// ІНФО-БЛОК (площа/склад приміщень/переваги/утеплення) — для нових моделей з каталогу
function buildInfo(lang){
  if(!d.rooms) return null;
  const div=document.createElement('div'); div.className='house-info';

  if(d.tagline){
    const p=document.createElement('p'); p.className='tagline';
    p.textContent = lang==='en' ? d.taglineEn : d.tagline;
    div.appendChild(p);
  }
  if(d.description){
    const p=document.createElement('p'); p.className='description';
    p.textContent = lang==='en' ? d.descriptionEn : d.description;
    div.appendChild(p);
  }

  const specs=document.createElement('div'); specs.className='mini-specs';
  const items = [
    [lang==='en'?'Dimensions':'Габарит', lang==='en'?d.dimsEn:d.dims],
    [lang==='en'?'Terrace':'Тераса', lang==='en'?d.terraceEn:d.terrace],
    [lang==='en'?'Bedrooms':'Спальні', lang==='en'?d.bedroomsEn:d.bedrooms],
  ];
  items.forEach(([label,val])=>{
    const box=document.createElement('div'); box.className='mini-spec';
    box.innerHTML = `<span>${label}</span><strong>${val}</strong>`;
    specs.appendChild(box);
  });
  div.appendChild(specs);

  const roomsBlock=document.createElement('div'); roomsBlock.className='rooms-block';
  const h4a=document.createElement('h4'); h4a.textContent = lang==='en'?'Room composition':'Склад приміщень';
  const pa=document.createElement('p'); pa.textContent = lang==='en'?d.roomsEn:d.rooms;
  roomsBlock.appendChild(h4a); roomsBlock.appendChild(pa);
  div.appendChild(roomsBlock);

  if(d.advantages){
    const advBlock=document.createElement('div'); advBlock.className='rooms-block';
    const h4b=document.createElement('h4'); h4b.textContent = lang==='en'?'Advantages':'Переваги';
    const pb=document.createElement('p'); pb.textContent = lang==='en'?d.advantagesEn:d.advantages;
    advBlock.appendChild(h4b); advBlock.appendChild(pb);
    div.appendChild(advBlock);
  }

  if(d.insulation){
    const insBox=document.createElement('div'); insBox.className='insulation-box';
    insBox.innerHTML = `<span>${lang==='en'?'Insulation':'Утеплення'}</span><strong>${lang==='en'?d.insulationEn:d.insulation}</strong>`;
    div.appendChild(insBox);
  }

  return div;
}

// HERO: головне фото + мініатюри інших фото праворуч (не додає висоти сторінці)
function buildHero(lang, title){
  const extras = [];
  if(d.extraImg) extras.push(d.extraImg);
  if(d.gallery) extras.push(...d.gallery);

  if(!extras.length){
    const img=document.createElement('img');
    img.src=d.media[0]; img.alt=title; img.className='single-img';
    return img;
  }

  const wrap=document.createElement('div'); wrap.className='hero-wrap';
  const mainImg=document.createElement('img');
  mainImg.src=d.media[0]; mainImg.alt=title; mainImg.className='hero-main';
  wrap.appendChild(mainImg);

  const thumbs=document.createElement('div'); thumbs.className='hero-thumbs';
  thumbs.classList.add(extras.length>=5 ? 'many' : 'few');
  const photoWord = lang==='en' ? 'photo' : 'фото';
  extras.slice(0,5).forEach((src,i)=>{
    const im=document.createElement('img');
    im.src=src; im.alt=`${title} — ${photoWord} ${i+1}`; im.loading='lazy';
    thumbs.appendChild(im);
  });
  wrap.appendChild(thumbs);
  return wrap;
}

// ASSEMBLE (перебудовується при кожній зміні мови)
const main=document.getElementById('main-content');

function render(){
  const lang = window.pdCurrentLang ? window.pdCurrentLang() : 'uk';
  main.innerHTML = '';

  const title = lang==='en' ? d.titleEn : d.title;
  const subtitle = lang==='en' ? d.subtitleEn : d.subtitle;
  document.title = 'pro DIM — ' + title;

  const h1=document.createElement('h1');
  h1.innerHTML=`${title}<small>${subtitle}</small>`;
  main.appendChild(h1);

  const img=buildHero(lang, title);
  main.appendChild(img);

  const info = buildInfo(lang);
  if(info) main.appendChild(info);

  main.appendChild(buildPriceBoxes(lang));

  main.appendChild(buildTable(SHARED_TABLE_1, lang));
  main.appendChild(buildTable(SHARED_TABLE_2, lang));

  if(d.blueprint){
    const bp=document.createElement('img');
    bp.src=d.blueprint;
    bp.alt = title + (lang==='en' ? ' — floor plan' : ' — креслення планування');
    bp.className='blueprint-img';
    bp.loading='lazy';
    main.appendChild(bp);
  }

  main.appendChild(buildChangeInfo(lang));

  const notice=document.createElement('div'); notice.className='notice';
  const noticeArr = lang==='en' ? d.noticeEn : d.notice;
  noticeArr.forEach(n=>{
    const p=document.createElement('p');
    p.innerHTML=n;
    notice.appendChild(p);
  });
  main.appendChild(notice);

  const thanksText = lang==='en' ? d.thanksEn : d.thanks;
  if(thanksText){
    const t=document.createElement('p');
    t.className='thanks';
    t.style.whiteSpace='pre-line';
    t.textContent=thanksText;
    main.appendChild(t);
  }
}

render();
window.pdOnLangChange = render;

</script>
